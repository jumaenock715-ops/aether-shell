name: Build Android bridge
on:
  push:
    paths:
      - 'android-bridge/**'
      - '.github/workflows/android-bridge.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build companion APK
        working-directory: android-bridge
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: aether-android-bridge-debug
          path: android-bridge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
