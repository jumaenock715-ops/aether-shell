name: Build and screenshot
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.*'
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libglib2.0-bin
      - name: Build
        run: |
          cmake -B build -S .
          cmake --build build -j
      - name: Capture desktop snapshots
        run: |
          mkdir -p shots
          : > run.log
          timeout 90 xvfb-run -a -s "-screen 0 1280x800x24" \
            dbus-run-session -- bash -euo pipefail -c '
              env QT_QPA_PLATFORM=xcb QT_QUICK_BACKEND=software \
                AETHER_DEMO_DIR="$PWD/shots" ./build/aether-shell > run.log 2>&1 &
              shell_pid=$!
              trap "kill $shell_pid 2>/dev/null || true" EXIT
              for attempt in $(seq 1 50); do
                if gdbus introspect --session --dest org.freedesktop.Notifications \
                    --object-path /org/freedesktop/Notifications > dbus-introspection.txt 2>&1; then
                  break
                fi
                sleep 0.2
              done
              grep -q "org.freedesktop.Notifications" dbus-introspection.txt
              gdbus call --session --dest org.freedesktop.Notifications \
                --object-path /org/freedesktop/Notifications \
                --method org.freedesktop.Notifications.GetCapabilities
              gdbus call --session --dest org.freedesktop.Notifications \
                --object-path /org/freedesktop/Notifications \
                --method org.freedesktop.Notifications.GetServerInformation
              gdbus call --session --dest org.freedesktop.Notifications \
                --object-path /org/freedesktop/Notifications \
                --method org.freedesktop.Notifications.Notify \
                "Aether CI" 0 "" "D-Bus smoke test" "Notification endpoint is responding." "[]" "{}" -1
              wait "$shell_pid"
            '
          cat run.log
          grep -q "AETHER_SETTINGS_WINDOW_LOADED" run.log || {
            echo "SettingsApp did not instantiate during the settings snapshot."
            exit 1
          }
          for snapshot in 01-start 02-launcher 03-settings 04-windows 05-quick-settings 06-notifications 07-light-theme; do
            test -s "shots/$snapshot.png" || { echo "Missing snapshot: $snapshot.png"; exit 1; }
          done
          ls -lh shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aether-desktop-snapshots
          path: |
            shots/*.png
            run.log
          if-no-files-found: error
